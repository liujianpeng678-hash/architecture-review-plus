name = "architecture-review-plus-service"
main = "worker.js"
compatibility_date = "2026-09-02"

[[d1_databases]]
binding = "DB"
database_name = "architecture-review-plus"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"

[vars]
TOKEN_TTL_SECONDS = "86400"
MAX_SUMMARY_BYTES = "262144"
ALLOWED_ORIGINS = "*"

# Set with `wrangler secret put TOKEN_SECRET` and `wrangler secret put ADMIN_TOKEN`.
